apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ate-api-server.yaml
  - ../ate-controller.yaml
  - ../atelet.yaml
  - ../atenet-dns.yaml
  - ../atenet-router.yaml
  - ../valkey.yaml
  - ../pod-certificate-controller.yaml
  # NOTE: no rustfs.yaml — RustFS lives on the Spark (§10.5)
  # NOTE: no otel-collector / prometheus — add later if you want them

patches:
  # ---- atelet: point snapshot storage at RustFS on the Spark ----
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: atelet
              args:
              - --gcp-auth-for-image-pulls=false
              - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
              - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
              env:
              - name: ATE_STORAGE_BACKEND
                value: s3
              - name: AWS_REGION
                value: us-east-1
              - name: AWS_ENDPOINT_URL
                value: http://10.0.2.160:9000
              - name: AWS_S3_USE_PATH_STYLE
                value: "true"
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: rustfs-credentials
                    key: AWS_ACCESS_KEY_ID
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: rustfs-credentials
                    key: AWS_SECRET_ACCESS_KEY
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: ""

  # ---- Valkey pinned to the NUC ----
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: valkey-cluster
        namespace: ate-system
      spec:
        template:
          spec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""

  # ---- control-plane components pinned to the NUC ----
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-api-server
        namespace: ate-system
      spec:
        template:
          spec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-controller
        namespace: ate-system
      spec:
        template:
          spec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: atenet-router
        namespace: ate-system
      spec:
        template:
          spec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dns
        namespace: ate-system
      spec:
        template:
          spec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: ""
