# Postgres client authentication for the Substrate state store on the Spark.
# Read top to bottom; the first matching line wins.

# Inside the container only: setup.sql, health checks.
local   all        all                                                  trust

# The cluster (pod traffic is masqueraded to Node IPs) and the workstation.
# TLS only, password logins only, Substrate's two logins only.
hostssl substrate  substrate_owner_user,substrate_readwrite_user  10.0.2.0/24  scram-sha-256

# Everything else, including any plaintext attempt.
host    all        all        0.0.0.0/0                                 reject
host    all        all        ::/0                                      reject
