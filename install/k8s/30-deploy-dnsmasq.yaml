apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsmasq
  namespace: netboot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dnsmasq
  template:
    metadata:
      labels:
        app: dnsmasq
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dnsmasq
          image: quay.io/poseidon/dnsmasq:latest
          args:
            - "-d"                                    # foreground
            - "-q"                                    # log queries
            - "--conf-file=/etc/dnsmasq/dnsmasq.conf"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/dnsmasq
      volumes:
        - name: config
          configMap:
            name: dnsmasq-config
