apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-assets
  namespace: netboot
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: fetch-assets
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 0
      containers:
        - name: fetch
          image: docker.io/curlimages/curl:8.11.1
          command: ["/bin/sh", "/scripts/fetch-assets.sh"]
          env:
            - name: TALOS_VERSION
              value: "v1.13.6"
            - name: SCHEMATIC
              value: "2d61dd07b20062062ea671b4d01873506103b67c0f7a4c3fb6cf4ee85585dcb8"
            - name: DEST
              value: "/assets"
            - name: BASE_URL
              value: "http://192.168.1.210:8080"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: assets
              mountPath: /assets
      volumes:
        - name: scripts
          configMap:
            name: fetch-assets-script
        - name: assets
          hostPath:
            path: /var/lib/netboot/assets
            type: DirectoryOrCreate
